name: Deploy to GitHub Pages

# main 브랜치의 site/ 폴더가 바뀌면 데이터 합본을 만든 뒤 gh-pages 브랜치로 복사 → GitHub Pages가 그 브랜치를 서빙
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 합본 생성 (site/data/*.json)
        run: node scripts/build-data.js
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
