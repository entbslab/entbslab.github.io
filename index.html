<script>
window.render = function (S) {
  document.getElementById('mv-en').textContent = S.tagline.en;
  document.getElementById('mv-ko').textContent = S.tagline.ko;

  // 배너 사진: heroImages(여러 장) → heroImage(한 장) → 없으면 단색 배경
  const imgs = (S.heroImages || []).map(x => typeof x === 'string' ? x : x.image).map(cssUrl).filter(Boolean);
  if (!imgs.length && cssUrl(S.heroImage)) imgs.push(cssUrl(S.heroImage));
  const box = document.getElementById('mv-slides');
  box.replaceChildren();
  (imgs.length ? imgs : ['']).forEach((bg, i) => {
    const d = document.createElement('div');
    d.className = 'mv-slide' + (i ? '' : ' on') + (bg ? '' : ' mv-plain');
    if (bg) d.style.backgroundImage = bg;   // cssUrl()이 주소를 검사·따옴표 처리
    box.appendChild(d);
  });

  if (imgs.length > 1) {
    const slides = box.children, ctrl = document.getElementById('mv-ctrl');
    const count = document.getElementById('mv-count'), btn = document.getElementById('mv-toggle');
    let i = 0, timer = null;
    const show = n => { slides[i].classList.remove('on'); i = (n + slides.length) % slides.length; slides[i].classList.add('on'); count.textContent = `${i + 1} / ${slides.length}`; };
    const play = () => { timer = setInterval(() => show(i + 1), 5000); btn.textContent = '일시정지'; btn.setAttribute('aria-label', '일시정지'); };
    const stop = () => { clearInterval(timer); timer = null; btn.textContent = '재생'; btn.setAttribute('aria-label', '재생'); };
    btn.onclick = () => timer ? stop() : play();
    ctrl.hidden = false; show(0); play();
  }
};
</script>
<script src="assets/main.js"></script>
