<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오시는 길 | 엔터테인먼트경영연구센터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
<script src="data/content.js"></script>
</head>
<body>
<header class="site-header" id="site-header"></header>

<section class="hero small">
  <div class="container">
    <span class="eyebrow">Contact</span>
    <h1>오시는 길</h1>
    <p>Location &amp; Contact</p>
  </div>
</section>

<section class="section">
  <div class="container split">
    <div>
      <div class="thumb" style="aspect-ratio:16/11;margin:0">지도 (네이버/구글 지도 임베드 위치)</div>
    </div>
    <aside class="info-box">
      <dl>
        <dt>주소</dt><dd id="addr"></dd>
        <dt>전화</dt><dd id="tel"></dd>
        <dt>이메일</dt><dd id="email"></dd>
        <dt>교통</dt><dd>지하철 6호선 안암역(고대병원앞) 1번 출구 도보 10분</dd>
      </dl>
      <p style="margin-top:20px"><a class="btn" id="map-link" target="_blank" rel="noopener">지도에서 보기</a></p>
    </aside>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/main.js"></script>
<script>
  const S = window.SITE;
  document.getElementById('addr').textContent = S.contact.address;
  document.getElementById('tel').textContent = S.contact.tel;
  document.getElementById('email').innerHTML = `<a href="mailto:${S.contact.email}">${S.contact.email}</a>`;
  document.getElementById('map-link').href = S.contact.mapUrl;
</script>
</body>
</html>
